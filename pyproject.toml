[project]
name = "wikirag-es"
version = "0.1.0"
description = "Asistente RAG local sobre Wikipedia en español"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "bertopic>=0.16.4",
    "click>=8.1.7",
    "faiss-cpu>=1.8.0.post1",
    "ftfy>=6.2.3",
    "hdbscan>=0.8.38.post1",
    "matplotlib>=3.8.0",
    "networkx>=3.3",
    "nltk>=3.9.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pydantic>=2.8.2",
    "pymupdf>=1.24.9",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "requests>=2.32.3",
    "scikit-learn>=1.5.1",
    "sentence-transformers>=3.0.1",
    "tqdm>=4.66.5",
    "umap-learn>=0.5.6",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu>=1.7.2",
]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.5.7",
]
turbovec = [
    "turbovec>=0.2.0",
]

[project.scripts]
wikirag = "wikirag_es.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
